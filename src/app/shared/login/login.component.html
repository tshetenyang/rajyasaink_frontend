<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Enter Your Email</mat-label>
          <input matInput id="username" formControlName="username" />
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            id="password"
            formControlName="password"
          />
        </mat-form-field>

        <div class="captcha-container">
          <img [src]="captchaimage" alt="Captcha" *ngIf="captchaimage" />
          <button mat-raised-button type="button" (click)="loadCaptcha()">
            Refresh Captcha
          </button>
        </div>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Captcha</mat-label>
          <input
            matInput
            id="captcha_response"
            formControlName="captcha_response"
          />
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="!form.valid"
        >
          Submit
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
