<div [formGroup]="formGroup" class="personal-details-form">
  <!-- Row 1 -->
  <div class="form-row">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>ID IC</mat-label>
      <input matInput formControlName="id_ic" required>
    </mat-form-field>
  </div>

  <!-- Row 2: Name Fields -->
  <div class="form-row">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="first_name" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Middle Name</mat-label>
      <input matInput formControlName="middle_name">
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="last_name" required>
    </mat-form-field>
  </div>

  <!-- Row 3: DOB and District -->
  <div class="form-row">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Date of Birth</mat-label>
      <input matInput [matDatepicker]="dobPicker" formControlName="date_of_birth">
      <mat-datepicker-toggle matSuffix [for]="dobPicker"></mat-datepicker-toggle>
      <mat-datepicker #dobPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>District</mat-label>
      <mat-select formControlName="district">
       <mat-option *ngFor="let district of districts" [value]="district.id">
      {{ district.name }}
    </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Row 4: Address -->
  <div class="form-row">
    <mat-form-field appearance="outline" class="form-field-full">
      <mat-label>Address</mat-label>
      <textarea matInput formControlName="address" rows="2"></textarea>
    </mat-form-field>
  </div>

  <!-- Row 5: Contact Info -->
  <div class="form-row">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>PIN Code</mat-label>
      <input matInput formControlName="pin_code" type="number">
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Phone Number</mat-label>
      <input matInput formControlName="phone_number" type="tel">
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email">
    </mat-form-field>
  </div>

  <!-- Row 6: Aadhar and Alive Status -->
  <div class="form-row">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Aadhar Number</mat-label>
      <input matInput formControlName="aadhar_number" type="text">
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Living Status</mat-label>
      <mat-select formControlName="is_alive">
        <mat-option [value]="true">Alive</mat-option>
        <mat-option [value]="false">Deceased</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field" *ngIf="!formGroup.get('is_alive')?.value">
      <mat-label>Expiry Date</mat-label>
      <input matInput [matDatepicker]="expiryPicker" formControlName="expiry_date">
      <mat-datepicker-toggle matSuffix [for]="expiryPicker"></mat-datepicker-toggle>
      <mat-datepicker #expiryPicker></mat-datepicker>
    </mat-form-field>
  </div>
</div>
