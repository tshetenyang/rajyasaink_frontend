<div class="esmIssuePlace-form-container">
    <h2>Add esmIssuePlace</h2>
    <form [formGroup]="esmIssuePlaceForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>esmIssuePlace Name</mat-label>
        <input matInput formControlName="name" placeholder="Enter esmIssuePlace name" />
        <mat-error *ngIf="esmIssuePlaceForm.get('name')?.hasError('required')">
          esmIssuePlace Name is required
        </mat-error>
        <mat-error *ngIf="esmIssuePlaceForm.get('name')?.hasError('minlength')">
          Minimum 3 characters required
        </mat-error>
      </mat-form-field>
  
      <button mat-raised-button color="primary" type="submit" [disabled]="esmIssuePlaceForm.invalid">
        Add esmIssuePlace
      </button>
    </form>
  </div>
  
  <!-- Table to display the esmIssuePlaces -->
  <div class="esmIssuePlace-table-container" *ngIf="esmIssuePlaces.length > 0">
    <h3>esmIssuePlaces List</h3>
    <table mat-table [dataSource]="esmIssuePlaces">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let esmIssuePlace"> {{ esmIssuePlace.id }} </td>
      </ng-container>
  
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let esmIssuePlace"> {{ esmIssuePlace.name }} </td>
      </ng-container>
  
      <ng-container matColumnDef="is_active">
        <th mat-header-cell *matHeaderCellDef> Active </th>
        <td mat-cell *matCellDef="let esmIssuePlace">
          <mat-slide-toggle 
            [checked]="esmIssuePlace.is_active" 
            (change)="onToggleStatus(esmIssuePlace, $event)">
          </mat-slide-toggle>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
