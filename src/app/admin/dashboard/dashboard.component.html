<mat-sidenav-container autosize="true">
  <mat-sidenav
    #sidenav="matSidenav"
    class="mat-elevation-z8"
    [fixedInViewport]="true"
    fixedTopGap="56"
    [(opened)]="toggleSidebar"
    mode="side"
  >
    <h2><mat-icon>dashboard</mat-icon> Admin Dashboard</h2>

    <mat-divider></mat-divider>

    <button mat-button class="menu-button" routerLink="/admin" routerLinkActive="router-link-active">
      <mat-icon>home</mat-icon>
      <span class="menucolor">Dashboard</span>
    </button>

    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-icon>person</mat-icon>
          <span class="menucolor">Masters Management</span>
        </mat-panel-title>
      </mat-expansion-panel-header>

      <button mat-button class="menu-button submenu-button" routerLink="/admin/masters/district" routerLinkActive="router-link-active">
        <mat-icon>location_city</mat-icon>
        <span class="menucolor">District</span>
      </button>
      <button mat-button class="menu-button submenu-button" routerLink="/admin/masters/corps" routerLinkActive="router-link-active">
        <mat-icon>groups</mat-icon>
        <span class="menucolor">Corps</span>
      </button>
      <button mat-button class="menu-button submenu-button" routerLink="/admin/masters/commission-type" routerLinkActive="router-link-active">
        <mat-icon>badge</mat-icon>
        <span class="menucolor">Commission Type</span>
      </button>
      <button mat-button class="menu-button submenu-button" routerLink="/admin/masters/qualifications" routerLinkActive="router-link-active">
        <mat-icon>school</mat-icon>
        <span class="menucolor">Qualification</span>
      </button>
      <button mat-button class="menu-button submenu-button" routerLink="/admin/masters/esm-issue-place" routerLinkActive="router-link-active">
        <mat-icon>place</mat-icon>
        <span class="menucolor">ESM Issue Place</span>
      </button>
      <button mat-button class="menu-button submenu-button" routerLink="/admin/masters/award-type" routerLinkActive="router-link-active">
        <mat-icon>emoji_events</mat-icon>
        <span class="menucolor">Award Type</span>
      </button>
    </mat-expansion-panel>

    <mat-divider></mat-divider>

    <button
      mat-button
      class="menu-button"
      routerLink="/admin/createuser"
      routerLinkActive="router-link-active"
    >
      <mat-icon>how_to_reg</mat-icon>
      <span class="menucolor">Create User</span>
    </button>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="main-container">
      <mat-toolbar>
        <button
          mat-icon-button
          aria-label="Example icon button with a menu icon"
          (click)="toggleSidebar = !toggleSidebar"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <app-breadcrumb></app-breadcrumb>
      </mat-toolbar>
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
